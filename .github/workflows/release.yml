name: Release

# 推送 v 開頭的標籤（例如 v1.0.0）時，自動打包並把 GraphicDesigner.html 附在 Release 上
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run build
        working-directory: source
      - run: gh release create "$GITHUB_REF_NAME" GraphicDesigner.html --title "GraphicDesigner $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
